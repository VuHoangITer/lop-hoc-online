<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Phụ đạo</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/mhchem.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#e2e8f0;color:#0f172a;font-size:14px;overflow:hidden}
button,select,input,textarea{font:inherit}
button{cursor:pointer}
[hidden]{display:none!important}

/* quyền */
.gone{display:none!important}
.tabEdit{font:inherit;outline:0;cursor:text}
body[data-role=student] .t-only{display:none!important}
body[data-role=teacher] .s-only{display:none!important}

/* thanh trên: tab trang + vài nút */
.top{display:flex;align-items:center;gap:4px;padding:4px 6px;background:#fff;border-bottom:1px solid #e2e8f0;min-height:44px}
.top h1{font-size:15px;margin:0 6px 0 2px;white-space:nowrap}
.badge{background:#e0e7ff;color:#3730a3;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600}
.grow{flex:1}
.btn{border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:6px 10px}
.btn:hover{background:#f1f5f9}
.btn.on{background:#fee2e2;border-color:#fca5a5;color:#b91c1c}
.btn.pri{background:#4f46e5;border-color:#4f46e5;color:#fff}
.btn.pri:hover{background:#4338ca}
label.chk{display:flex;align-items:center;gap:5px;cursor:pointer}
.ib{position:relative;flex:none;width:36px;height:36px;border:0;background:none;border-radius:9px;font-size:18px;padding:0;display:flex;align-items:center;justify-content:center}
.ib:hover{background:#f1f5f9}
.ib.on{background:#fee2e2}
.dot{position:absolute;top:5px;right:5px;width:9px;height:9px;border-radius:50%;background:#ef4444;border:2px solid #fff}
#count{flex:none;font-size:12px;color:#64748b;padding:0 4px;white-space:nowrap}

/* tab trang */
.tabs{flex:1;min-width:0;display:flex;gap:4px;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid #cbd5e1;background:#f8fafc;border-radius:8px;padding:5px 10px;height:32px}
.tab.on{background:#4f46e5;color:#fff;border-color:#4f46e5}
.tab .x{opacity:.8;margin-left:6px;padding:0 2px}

/* menu bật lên (màu, hình, thêm) */
.pop{position:fixed;z-index:60;background:#fff;border:1px solid #cbd5e1;border-radius:12px;box-shadow:0 8px 24px #0003;padding:8px;display:flex;flex-wrap:wrap;gap:6px;max-width:min(300px,94vw)}
.pop .full{width:100%;text-align:left}
.pop .rowp{display:flex;gap:6px;align-items:center;width:100%;flex-wrap:wrap}

/* vùng chính */
.main{flex:1;display:flex;min-height:0;position:relative;overflow:hidden}
.tools{display:none;flex-direction:column;align-items:center;justify-content:center;gap:3px;width:48px;padding:4px;background:#fff;border-right:1px solid #e2e8f0;overflow:auto;scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
body[data-role=teacher] .tools,body.can-draw .tools{display:flex}
.tb{flex:none;width:38px;height:36px;border:1px solid transparent;background:#fff;border-radius:9px;font-size:18px;padding:0;display:flex;align-items:center;justify-content:center}
.tb:hover{background:#f1f5f9}
.tb.on{background:#4f46e5;color:#fff;border-color:#4f46e5}
.tools hr{width:70%;border:0;border-top:1px solid #e2e8f0;margin:2px 0;flex:none}
.cdot{width:24px;height:24px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #94a3b8}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #cbd5e1;padding:0}
.sw.on{box-shadow:0 0 0 3px #4f46e5}
.wd{width:56px;height:32px;border:1px solid #e2e8f0;background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0}
.wd i{display:block;width:30px;background:#111;border-radius:99px}
.wd.on{border-color:#4f46e5;background:#eef2ff}
input[type=color]{width:34px;height:30px;padding:0;border:1px solid #cbd5e1;border-radius:6px;background:none}

/* điện thoại dọc: thanh công cụ nằm ngang ngay dưới thanh trên */
@media (orientation:portrait){
  .main{flex-direction:column}
  .tools{flex-direction:row;width:auto;height:46px;padding:4px 6px;border-right:0;border-bottom:1px solid #e2e8f0;justify-content:safe center}
  .tools hr{width:1px;height:60%;border:0;border-left:1px solid #e2e8f0;margin:0 2px}
  .tools{gap:2px}
  .tb{width:32px}
}
/* điện thoại nằm ngang: thấp, nên thu nhỏ thanh trên và nút */
@media (orientation:landscape) and (max-height:500px){
  .top{min-height:38px;padding:2px 6px}
  .top h1{display:none}
  .ib{width:32px;height:32px;font-size:16px}
  .tab{height:28px;padding:3px 9px}
  /* màn hình thấp: xếp công cụ thành 2 cột để không bị che */
  body[data-role=teacher] .tools,body.can-draw .tools{display:grid}
  .tools{grid-template-columns:repeat(2,34px);grid-auto-rows:32px;gap:3px;width:auto;padding:4px;align-content:center;justify-content:center}
  .tb{width:34px;height:32px;font-size:16px}
  .tools hr{display:none}
}
.tools{justify-content:safe center}
#count{border:0;background:none;border-radius:9px;height:32px;cursor:pointer}
#count:hover{background:#f1f5f9}
.ulist{display:flex;flex-direction:column;gap:2px;min-width:160px}
.ulist div{padding:6px 8px;border-radius:6px;white-space:nowrap}
.ulist div::before{content:'🟢 '}
@media (max-width:500px){ .top h1{display:none} }

.area{flex:1;min-width:0;position:relative;background:#e2e8f0;overflow:hidden}
#stage{position:absolute;inset:0;background-color:#fff;overflow:hidden;touch-action:none}
.area{touch-action:none}
.bg-grid{background-image:linear-gradient(#cfe0f0 1px,transparent 1px),linear-gradient(90deg,#cfe0f0 1px,transparent 1px);background-size:var(--u) var(--u)}
.bg-lined{background-image:linear-gradient(#cfe0f0 1px,transparent 1px);background-size:100% calc(var(--u) * 1.5)}
#stage{background-position:var(--bx,0) var(--by,0)}
.bg-dots{background-image:radial-gradient(#b8c4d0 1.6px,transparent 1.7px);background-size:var(--u) var(--u)}
#cv{position:absolute;left:0;top:0;width:100%;height:100%}
#dom{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;pointer-events:none}
.ti{position:absolute;white-space:pre-wrap;line-height:1.35;padding:2px 4px;border:2px dashed transparent;font-family:"Times New Roman",serif;user-select:none}
.im{position:absolute;border:2px dashed transparent;user-select:none}
.im img{width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none}
.sel .ti,.sel .im{pointer-events:auto;cursor:move}
.selected{border-color:#4f46e5!important}
.laser{position:absolute;width:18px;height:18px;border-radius:50%;background:#ef4444;box-shadow:0 0 12px 6px #ef444488;transform:translate(-50%,-50%);pointer-events:none;display:none}
.zapFlash{position:fixed;inset:0;z-index:150;pointer-events:none;background:radial-gradient(circle,#fff9 0%,#60a5fa66 40%,#facc1533 70%,transparent 100%);animation:zapF .7s steps(7) forwards}
@keyframes zapF{0%,28%,56%{opacity:1}14%,42%,70%{opacity:.15}100%{opacity:0}}
body.shake{animation:shake .6s}
@keyframes shake{0%,100%{transform:none}10%{transform:translate(-6px,3px)}20%{transform:translate(5px,-4px)}30%{transform:translate(-4px,-2px)}40%{transform:translate(6px,4px)}50%{transform:translate(-5px,2px)}60%{transform:translate(4px,-3px)}70%{transform:translate(-3px,3px)}80%{transform:translate(2px,-2px)}}
#zapBtn{font-size:19px}
.rail{position:absolute;top:0;right:0;bottom:0;width:30px;z-index:14;touch-action:none;background:linear-gradient(90deg,transparent,#0f172a0d);cursor:pointer}
.rail .thumb{position:absolute;right:4px;width:20px;min-height:48px;border-radius:10px;background:#475569b3;box-shadow:0 1px 4px #0003;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;line-height:1}
.rail.drag .thumb{background:#2563ebd9}
.zoomInfo{position:absolute;right:36px;bottom:8px;background:#0f172acc;color:#fff;padding:6px 12px;border-radius:99px;font-size:12px;z-index:15;border:0;cursor:pointer}
.banner{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:#dc2626;color:#fff;padding:6px 14px;border-radius:99px;z-index:20}

/* chat: ngăn kéo trượt ra từ bên phải, không chiếm chỗ của bảng */
.side{position:absolute;right:0;top:0;bottom:0;width:min(320px,88vw);display:flex;flex-direction:column;background:#fff;border-left:1px solid #e2e8f0;transform:translateX(105%);transition:transform .2s;z-index:30;box-shadow:-4px 0 16px #0002}
body.side-open .side{transform:none}
.sideHead{display:flex;align-items:center;justify-content:space-between;padding:6px 6px 6px 12px;border-bottom:1px solid #e2e8f0;font-weight:700}
.pane{flex:1;min-height:0;display:flex;flex-direction:column}
#chatBox{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
.msg{background:#f1f5f9;border-radius:10px;padding:6px 10px;word-break:break-word}
.msg.me{background:#e0e7ff;align-self:flex-end}
.chatIn{display:flex;gap:6px;padding:8px;border-top:1px solid #e2e8f0}
.chatIn input{flex:1;min-width:0;padding:8px;border:1px solid #cbd5e1;border-radius:8px;font-size:16px}

/* hộp thoại */
.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:100;padding:12px}
.modal .card{background:#fff;border-radius:14px;padding:20px;width:min(380px,100%)}
.modal .card.wide{width:min(640px,100%);max-height:96vh;overflow:auto}
.modal h3{margin:0 0 10px}
.modal input[type=text],.modal textarea,.modal select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;margin-bottom:10px}
#codeIn::placeholder{text-transform:none}
.modal textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;resize:vertical}
.hint{color:#64748b;font-size:13px;margin-bottom:8px}
.hint code{background:#f1f5f9;padding:1px 5px;border-radius:4px}
.syms{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.syms button{border:1px solid #cbd5e1;background:#fff;border-radius:6px;padding:3px 8px;font-size:14px}
.syms button:hover{background:#eef2ff}
.prev{min-height:60px;max-height:160px;overflow:auto;border:1px dashed #cbd5e1;border-radius:8px;padding:8px;margin-bottom:10px;font-size:22px;white-space:pre-wrap;font-family:"Times New Roman",serif}
.row{display:flex;align-items:center;gap:8px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:8px 16px;border-radius:99px;z-index:200}

</style>
</head>
<body data-role="student">

<div class="top">
  <h1 id="title">Phụ đạo</h1>
  <div class="tabs" id="tabs"></div>
  <button id="count" title="Ai đang trong phòng">👥 0</button>
  <button class="ib" id="listenBtn" hidden title="Nghe mic người kia">🔊</button>
  <button class="ib" id="micBtn" title="Bật/tắt mic">🎤</button>
  <button class="ib" id="zapBtn" title="Chích điện người kia ⚡">⚡</button>
  <button class="ib" id="sideBtn" title="Chat">💬<i class="dot" id="chatDot" hidden></i></button>
  <button class="ib" id="moreBtn" title="Thêm">⋯</button>

  <span class="badge gone" id="roleBadge">…</span>
  <label class="chk gone"><input type="checkbox" id="allowChk"> Cho HS viết</label>
  <button class="gone" id="logoutBtn"></button>
  <button class="gone" id="codeBtn"></button>
  <button class="gone" id="handBtn"></button>
</div>

<div class="pop" id="morePop" hidden>
  <select id="bgSel" class="btn full" title="Nền trang">
    <option value="blank">Nền trắng</option>
    <option value="grid">Ô ly</option>
    <option value="lined">Dòng kẻ</option>
    <option value="dots">Chấm</option>
  </select>
  <button class="btn full" id="linkBtn">🔗 Copy link</button>
</div>
<div class="pop" id="usersPop" hidden><div class="ulist" id="ulist"></div></div>
<div class="pop" id="shapePop" hidden>
  <button class="tb" data-tool="line" title="Đường thẳng">╱</button>
  <button class="tb" data-tool="arrow" title="Mũi tên">➜</button>
  <button class="tb" data-tool="rect" title="Hình chữ nhật">▭</button>
  <button class="tb" data-tool="ellipse" title="Hình tròn / elip">◯</button>
</div>
<div class="pop" id="colorPop" hidden>
  <div class="rowp" id="swatches"></div>
  <div class="rowp">
    <button class="wd" data-w="3" title="Nét mảnh"><i style="height:2px"></i></button>
    <button class="wd on" data-w="6" title="Nét vừa"><i style="height:5px"></i></button>
    <button class="wd" data-w="12" title="Nét đậm"><i style="height:10px"></i></button>
    <input type="color" id="customColor" value="#111111" title="Màu khác">
  </div>
</div>

<div class="main">
  <div class="tools" id="tools">
    <button class="tb on" data-tool="pen" title="Bút">✏️</button>
    <button class="tb" data-tool="eraser" title="Tẩy">🧽</button>
    <button class="tb" id="shapeBtn" title="Hình: thẳng, mũi tên, chữ nhật, tròn">◯</button>
    <button class="tb" data-tool="text" title="Chữ / công thức">T</button>
    <button class="tb" id="imgBtn" title="Chèn ảnh đề bài (cũng có thể Ctrl+V)">🖼</button>
    <button class="tb" data-tool="select" title="Chọn / di chuyển / xóa">🖐</button>
    <button class="tb" data-tool="laser" title="Con trỏ laser">🔴</button>
    <button class="tb" id="colorBtn" title="Màu và độ đậm"><i class="cdot" id="cdot"></i></button>
    <hr>
    <button class="tb" id="undoBtn" title="Hoàn tác (Ctrl+Z)">↩</button>
    <button class="tb" id="clearBtn" title="Xóa cả trang">🗑</button>
    <input type="file" id="fileIn" accept="image/*" hidden>
  </div>

  <div class="area" id="area">
    <div id="stage" class="bg-blank">
      <canvas id="cv"></canvas>
      <div id="dom"></div>
      <div class="laser" id="laser"></div>
    </div>
    <div class="rail" id="rail" title="Kéo để cuộn bảng lên/xuống"><div class="thumb" id="thumb">⇕</div></div>
    <button class="zoomInfo" id="zoomInfo" hidden title="Bấm để về đầu trang, cỡ vừa màn hình"></button>
    <div class="banner" id="banner" hidden>Mất kết nối, đang thử lại…</div>
  </div>

  <div class="side" id="side">
    <div class="sideHead">💬 Chat <button class="ib" id="sideClose" title="Đóng">✕</button></div>
    <div class="pane" id="paneChat">
      <div id="chatBox"></div>
      <div class="chatIn"><input id="chatIn" placeholder="Nhắn tin…" maxlength="500"><button class="btn pri" id="chatSend">Gửi</button></div>
    </div>
    <div class="gone" id="paneUsers"><span id="usersTab"></span><div id="userList"></div></div>
  </div>
</div>

<audio id="aud" autoplay playsinline></audio>

<div class="modal" id="nameModal" hidden>
  <div class="card">
    <h3>Vào lớp học</h3>
    <input type="text" id="nameIn" placeholder="Tên của bạn" maxlength="30">
    <input type="text" class="gone" id="codeIn" placeholder="Mã giáo viên (HS bỏ trống)" maxlength="20" autocomplete="off" style="text-transform:uppercase">
    <button class="btn pri" id="joinBtn" style="width:100%;padding:10px">Vào lớp</button>
  </div>
</div>

<div class="modal" id="editor" hidden>
  <div class="card wide">
    <h3>Chữ / công thức</h3>
    <div class="hint">Công thức đặt trong dấu <code>$…$</code>, ví dụ <code>$x^2+2x+1=0$</code>. Hóa học: <code>$\ce{2H2 + O2 -> 2H2O}$</code>. Bấm nút bên dưới để chèn nhanh.</div>
    <div class="syms" id="syms"></div>
    <textarea id="edText" rows="5" placeholder="Gõ nội dung..."></textarea>
    <div class="prev" id="edPrev"></div>
    <div class="row">
      <span>Cỡ chữ</span>
      <select id="edSize" style="width:auto;margin:0">
        <option value="28">Nhỏ</option><option value="40" selected>Vừa</option>
        <option value="56">Lớn</option><option value="80">Rất lớn</option>
      </select>
      <span class="grow"></span>
      <button class="btn" id="edCancel">Hủy</button>
      <button class="btn pri" id="edOk">Chèn</button>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';
const W = 1600, H = 900;
const $ = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);

/* ---------- trạng thái ---------- */
const code = 'LOP';
const hk = new URLSearchParams(location.hash.slice(1)).get('key');
if (hk) { localStorage.setItem('bw_key_' + code, hk); history.replaceState(null, '', location.pathname); }
let key = localStorage.getItem('bw_key_' + code) || '';

let socket = null;
let me = { id: '', role: 'student' };
let myName = '';
let pages = [], cur = null, items = {}, allowDraw = false;
let tool = 'pen', color = '#111111', width = 6;
let scale = 1, k = 1, vx = 0, vy = 0, zoomRel = 1, fitS = 1;
const MAXY = 20000; // trang dài như cuốn vở, kéo xuống bằng 2 ngón
let drawing = null, drawPage = null, pend = [], lastEmit = 0, lasering = false, lastLaser = 0;
let myStack = [], selId = null, drag = null, domEls = {};
let users = [], hands = [];
let micStream = null, peers = {}, spc = null;

const isT = () => me.role === 'teacher';
const stage = $('#stage'), cv = $('#cv'), dom = $('#dom'), area = $('#area');
const ctx = cv.getContext('2d');
const COLORS = ['#111111', '#e11d48', '#2563eb', '#16a34a', '#f59e0b', '#7c3aed', '#0891b2'];
const ICE = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}

/* ---------- bố cục ---------- */
/* Bảng rộng W=1600 đơn vị, dài tới MAXY. Mặc định vừa khít chiều ngang màn hình,
   2 ngón tay để kéo lên/xuống và phóng to. */
function clampView() {
  const r = area.getBoundingClientRect();
  zoomRel = Math.min(5, Math.max(1, zoomRel));
  scale = fitS * zoomRel;
  const vw = r.width / scale, vh = r.height / scale;
  vx = Math.min(Math.max(0, vx), Math.max(0, W - vw));
  vy = Math.min(Math.max(0, vy), MAXY - vh);
}
function applyView() {
  clampView();
  stage.style.setProperty('--u', (40 * scale) + 'px');
  stage.style.setProperty('--bx', (-vx * scale) + 'px');
  stage.style.setProperty('--by', (-vy * scale) + 'px');
  dom.style.transform = 'translate(' + (-vx * scale) + 'px,' + (-vy * scale) + 'px) scale(' + scale + ')';
  k = (window.devicePixelRatio || 1) * scale;
  redraw();
  const zi = $('#zoomInfo');
  if (zi) {
    zi.hidden = zoomRel < 1.05 && vy < 5;
    zi.textContent = (zoomRel >= 1.05 ? Math.round(zoomRel * 100) + '% · ' : '') + 'Dòng ' + Math.round(vy / 40 + 1) + '  ⤒';
  }
  updRail();
}
/* thanh cuộn bên phải: chiều dài theo phần đã viết + thêm 1 màn hình trống bên dưới */
function contentBottom() {
  let m = 0;
  (items[cur] || []).forEach((it) => {
    if (it.pts) { for (let i = 1; i < it.pts.length; i += 2) if (it.pts[i] > m) m = it.pts[i]; }
    else if (it.y2 != null) m = Math.max(m, it.y1, it.y2);
    else if (it.y != null) m = Math.max(m, it.y + (it.h || 60));
  });
  return m;
}
let railMax = 0;
function updRail() {
  const rail = $('#rail'), th = $('#thumb');
  if (!rail) return;
  const vh = area.clientHeight / scale;
  if (!rail.classList.contains('drag')) railMax = Math.min(MAXY, Math.max(contentBottom() + vh, vy + vh * 1.5, vh * 2.5));
  const H = rail.clientHeight;
  const tH = Math.max(48, H * vh / railMax);
  th.style.height = tH + 'px';

    const src = c.toDataURL('image/jpeg', 0.85);
    let dw = Math.min(w, 900), dh = Math.round(h * dw / w);
    if (dh > 760) { dh = 760; dw = Math.round(w * dh / h); }
    const vw = area.clientWidth / scale;
    if (dw > vw * 0.9) { dh = Math.round(dh * vw * 0.9 / dw); dw = Math.round(vw * 0.9); }
    addLocal({ id: uid(), t: 'img', x: Math.round(vx + vw * 0.05), y: Math.round(vy + 20), w: dw, h: dh, src });
    URL.revokeObjectURL(url);
    setTool('select');
  };
  im.src = url;
}

/* ---------- trang ---------- */
function renderTabs() {
  const box = $('#tabs');
  box.textContent = '';
  pages.forEach((p) => {
    const b = document.createElement('button');
    b.className = 'tab' + (p.id === cur ? ' on' : '');
    b.dataset.id = p.id;
    b.textContent = p.name;
    b.title = 'Bấm đúp để đổi tên';
    b.onclick = () => { if (p.id !== cur) socket.emit('page:set', { id: p.id }); };
    if (p.id === cur && pages.length > 1) {
      const x = document.createElement('span');
      x.className = 'x'; x.textContent = '×';
      x.onclick = (ev) => { ev.stopPropagation(); socket.emit('page:delete', { id: p.id }); };
      b.appendChild(x);
    }
    box.appendChild(b);
  });
  const add = document.createElement('button');
  add.className = 'tab'; add.textContent = '＋'; add.title = 'Thêm trang'; add.style.minWidth = '40px';
  add.onclick = () => {
    if (Date.now() - (renderTabs.lastAdd || 0) < 800) return; // tránh bấm đúp ra 2 trang
    renderTabs.lastAdd = Date.now();
    const p = pages.find((x) => x.id === cur);
    socket.emit('page:add', { name: 'Trang ' + (pages.length + 1), bg: p ? p.bg : 'grid' });
  };
  box.appendChild(add);
}
/* bấm đúp vào tab để đổi tên (bắt ở #tabs vì bấm lần 1 có thể vẽ lại tab) */
$('#tabs').addEventListener('dblclick', (e) => {
  const t = e.target.closest('[data-id]');
  const p = t && pages.find((x) => x.id === t.dataset.id);
  if (!p) return;
  const inp = document.createElement('input');
  inp.className = 'tab on tabEdit';
  inp.value = p.name;
  inp.maxLength = 20;
  inp.style.width = Math.max(80, t.offsetWidth) + 'px';
  t.style.display = 'none';
  t.after(inp);
  inp.focus(); inp.select();
  let done = false;
  const finish = (save) => {
    if (done) return;
    done = true;
    const n = inp.value.trim();
    if (save && n && n !== p.name) socket.emit('page:rename', { id: p.id, name: n });
    renderTabs();
  };
  inp.onkeydown = (ev) => { ev.stopPropagation(); if (ev.key === 'Enter') finish(true); else if (ev.key === 'Escape') finish(false); };
  inp.onblur = () => finish(true);
  inp.onclick = (ev) => ev.stopPropagation();
  inp.ondblclick = (ev) => ev.stopPropagation();
});

function applyBg() {
  const p = pages.find((x) => x.id === cur);
  const bg = p ? p.bg : 'blank';
  stage.className = 'bg-' + bg + (tool === 'select' ? ' sel' : '');
  $('#bgSel').value = bg;
}
$('#bgSel').onchange = (e) => socket.emit('page:bg', { id: cur, bg: e.target.value });
$('#allowChk').onchange = (e) => socket.emit('allowDraw', { value: e.target.checked });
$('#linkBtn').onclick = async () => {
  const link = location.origin + '/';
  try { await navigator.clipboard.writeText(link); toast('Đã copy link lớp: ' + link); }
  catch (e) { prompt('Link lớp học:', link); }
};

/* ---------- chat, người trong lớp, giơ tay ---------- */
function addChat(m) {
  const d = document.createElement('div');
  const mine = m.name === myName;
  d.className = 'msg' + (mine ? ' me' : '');
  const b = document.createElement('b');
  b.textContent = m.name + ': ';
  d.append(b, document.createTextNode(m.text));
  $('#chatBox').appendChild(d);
  $('#chatBox').scrollTop = 1e9;
  if (!mine && !live0 && !document.body.classList.contains('side-open')) {
    $('#chatDot').hidden = false;
    toast('💬 ' + m.name + ': ' + m.text.slice(0, 60));
  }
}
let live0 = false;
function sendChat() {
  const v = $('#chatIn').value.trim();
  if (!v) return;
  socket.emit('chat', { text: v });
  $('#chatIn').value = '';
}
$('#chatSend').onclick = sendChat;
$('#chatIn').addEventListener('keydown', (e) => { if (e.key === 'Enter') sendChat(); });
$$('.stabs button').forEach((b) => (b.onclick = () => {
  $$('.stabs button').forEach((x) => x.classList.toggle('on', x === b));
  $('#paneChat').hidden = b.dataset.pane !== 'chat';
  $('#paneUsers').hidden = b.dataset.pane !== 'users';
}));
function setSide(open) {
  document.body.classList.toggle('side-open', open);
  if (open) { $('#chatDot').hidden = true; setTimeout(() => $('#chatIn').focus(), 200); }
}
$('#sideBtn').onclick = () => setSide(!document.body.classList.contains('side-open'));
$('#sideClose').onclick = () => setSide(false);

function renderUsers() {
  $('#count').textContent = users.length > 1 ? '🟢 ' + users.length : '⚪ 1';
  $('#count').title = users.map((u) => u.name).join(', ');
  const ul = $('#ulist');
  ul.textContent = '';
  users.forEach((u) => { const d = document.createElement('div'); d.textContent = u.name + (u.id === me.id ? ' (bạn)' : ''); ul.appendChild(d); });
  $('#usersTab').textContent = '👥 Lớp (' + users.length + ')';
  const box = $('#userList');
  box.textContent = '';
  const raised = new Set(hands.map((h) => h.id));
  [...users].sort((a, b) => (raised.has(b.id) - raised.has(a.id)) || (a.role === 'teacher' ? -1 : 1)).forEach((u) => {
    const d = document.createElement('div');
    d.className = 'u' + (raised.has(u.id) ? ' hand' : '');
    const n = document.createElement('span');
    n.className = 'nm';
    n.textContent = u.name + (u.id === me.id ? ' (bạn)' : '');
    d.appendChild(n);
    if (raised.has(u.id)) {
      const h = document.createElement('span'); h.textContent = '✋'; d.appendChild(h);
      if (isT()) {
        const b = document.createElement('button');
        b.className = 'btn'; b.textContent = 'Hạ tay';
        b.onclick = () => socket.emit('hand:clear', { id: u.id });
        d.appendChild(b);
      }
    }
    box.appendChild(d);
  });
  const mine = raised.has(me.id);
  $('#handBtn').classList.toggle('on', mine);
  $('#handBtn').textContent = mine ? '✋ Hạ tay' : '✋ Giơ tay';
  const n = hands.length;
  if (isT()) $('#usersTab').textContent += n ? ' ✋' + n : '';
}
$('#handBtn').onclick = () => socket.emit('hand', { value: !hands.some((h) => h.id === me.id) });

/* ---------- ⚡ chích điện ---------- */
let ac = null;
function getAC() {
  if (!ac) { const C = window.AudioContext || window.webkitAudioContext; if (C) ac = new C(); }
  if (ac && ac.state === 'suspended') ac.resume();
  return ac;
}
// trình duyệt điện thoại chỉ cho phát tiếng sau khi người dùng chạm vào trang
document.addEventListener('pointerdown', () => getAC(), { once: true, capture: true });
function zapSound() {
  const a = getAC();
  if (!a) return;
  const t = a.currentTime, dur = 0.85;
  const out = a.createGain();
  out.gain.setValueAtTime(0.0001, t);
  out.gain.exponentialRampToValueAtTime(0.32, t + 0.02);
  out.gain.setValueAtTime(0.32, t + dur - 0.15);
  out.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  out.connect(a.destination);
  // tiếng "rè rè" của dòng điện: sóng răng cưa tần số thấp, bóp méo cho gắt
  const shaper = a.createWaveShaper();
  const curve = new Float32Array(1024);
  for (let i = 0; i < 1024; i++) { const x = i / 512 - 1; curve[i] = Math.tanh(x * 6); }
  shaper.curve = curve;
  const buzzG = a.createGain();
  buzzG.gain.value = 0.5;
  [58, 117, 176].forEach((f, i) => {
    const o = a.createOscillator();
    o.type = i === 1 ? 'square' : 'sawtooth';
    o.frequency.setValueAtTime(f, t);
    o.frequency.linearRampToValueAtTime(f * 1.08, t + dur);
    o.connect(shaper); o.start(t); o.stop(t + dur);
  });
  shaper.connect(buzzG);
  // nhấp nháy 25 lần/giây như tia lửa điện
  const lfo = a.createOscillator(), lfoG = a.createGain();
  lfo.type = 'square'; lfo.frequency.value = 25; lfoG.gain.value = 0.45;
  lfo.connect(lfoG); lfoG.connect(buzzG.gain); lfo.start(t); lfo.stop(t + dur);
  buzzG.connect(out);
  // tiếng lách tách: nhiễu trắng lọc cao, bật tắt ngẫu nhiên
  const n = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
  let on = 1;
  for (let i = 0; i < n; i++) { if (i % 400 === 0) on = Math.random() < 0.55 ? 1 : 0; d[i] = (Math.random() * 2 - 1) * on; }
  const noise = a.createBufferSource(); noise.buffer = buf;
  const hp = a.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 2500;
  const nG = a.createGain(); nG.gain.value = 0.35;
  noise.connect(hp); hp.connect(nG); nG.connect(out); noise.start(t);
}
function zapEffect() {
  zapSound();
  const f = document.createElement('div');
  f.className = 'zapFlash';
  document.body.appendChild(f);
  setTimeout(() => f.remove(), 800);
  document.body.classList.remove('shake'); void document.body.offsetWidth; document.body.classList.add('shake');
  setTimeout(() => document.body.classList.remove('shake'), 650);
  if (navigator.vibrate) navigator.vibrate([90, 40, 90, 40, 160]);
}
let lastZapSend = 0;
function sendZap() {
  if (!socket || Date.now() - lastZapSend < 800) return;
  lastZapSend = Date.now();
  socket.emit('zap');
  zapSound();
  toast(users.length > 1 ? '⚡ Đã chích!' : '⚡ Chưa có ai trong phòng để chích');
}
$('#zapBtn').onclick = sendZap;

/* ---------- mic giảng bài (WebRTC) ---------- */
function addIce(pc, c) {
  if (pc.remoteDescription) pc.addIceCandidate(c).catch(() => {});
  else (pc._q || (pc._q = [])).push(c);
}
async function setRemote(pc, sdp) {
  await pc.setRemoteDescription(sdp);
  (pc._q || []).forEach((c) => pc.addIceCandidate(c).catch(() => {}));
  pc._q = [];
}
function stopMic() {
  if (micStream) micStream.getTracks().forEach((t) => t.stop());
  micStream = null;
  Object.values(peers).forEach((pc) => pc.close());
  peers = {};
}
$('#micBtn').onclick = async () => {
  if (!micStream) {
    try { micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } }); }
    catch (e) { alert('Không bật được mic. Hãy cho phép trình duyệt dùng micro (cần mở bằng https).'); return; }
    socket.emit('voice', { on: true });
  } else { stopMic(); socket.emit('voice', { on: false }); }
  updMic();
};
function updMic() {
  const b = $('#micBtn');
  b.classList.toggle('on', !!micStream);
  b.title = micStream ? 'Đang phát mic (bấm để tắt)' : 'Bật mic';
}
async function callStudent(id) {
  if (peers[id]) peers[id].close();
  const pc = new RTCPeerConnection(ICE);
  peers[id] = pc;
  micStream.getTracks().forEach((t) => pc.addTrack(t, micStream));
  pc.onicecandidate = (e) => { if (e.candidate) socket.emit('rtc:signal', { to: id, data: { ice: e.candidate } }); };
  await pc.setLocalDescription(await pc.createOffer());
  socket.emit('rtc:signal', { to: id, data: { sdp: pc.localDescription } });
}
function closeStudentPc() { if (spc) { spc.close(); spc = null; } $('#aud').srcObject = null; }
function tryPlay() {
  const a = $('#aud');
  a.play().then(() => { $('#listenBtn').textContent = a.muted ? '🔇' : '🔊'; })
    .catch(() => { $('#listenBtn').textContent = '🔇'; toast('Bấm 🔇 để nghe mic'); });
}
$('#listenBtn').onclick = () => {
  const a = $('#aud');
  if (a.paused) { a.muted = false; tryPlay(); } else { a.muted = !a.muted; $('#listenBtn').textContent = a.muted ? '🔇' : '🔊'; }
};
function onVoice({ on, by }) {
  if (by && by === me.id) return;
  if (on && micStream) { stopMic(); updMic(); toast('Người kia đã bật mic, mic của bạn tạm tắt'); }
  closeStudentPc();
  $('#listenBtn').hidden = !on;
  if (on) socket.emit('rtc:ready');
}

/* ---------- socket ---------- */
function init(res) {
  me = { id: res.id, role: res.role };
  document.body.dataset.role = me.role;
  $('#roleBadge').textContent = isT() ? 'Giáo viên' : 'Học sinh';
  $('#title').textContent = res.title;
  document.title = res.title;
  pages = res.state.pages.map((p) => ({ id: p.id, name: p.name, bg: p.bg }));
  items = {};
  res.state.pages.forEach((p) => { items[p.id] = p.items; });
  if (cur !== res.state.current) { vx = 0; vy = 0; zoomRel = 1; }
  cur = res.state.current;
  allowDraw = res.state.allowDraw;
  document.body.classList.toggle('can-draw', allowDraw);
  $('#allowChk').checked = allowDraw;
  if (!isT() && !allowDraw) setTool('laser'); else if (!isT() && tool !== 'pen' && tool !== 'text') setTool('pen');
  users = res.users; hands = res.hands;
  $('#chatBox').textContent = '';
  live0 = true; res.chat.forEach(addChat); live0 = false;
  select(null); myStack = [];
  renderTabs(); applyBg(); renderUsers(); fit(); renderDom();
  $('#banner').hidden = true;
  updMic();
  if (micStream) socket.emit('voice', { on: true });
  else onVoice({ on: res.voice, by: res.voiceBy });
}

function connect() {
  socket = io();
  socket.on('connect', () => {
    socket.emit('join', { code, key, name: myName }, (res) => {
      if (res.error) {
        document.body.innerHTML = '<p style="padding:40px;font:18px sans-serif">' + res.error + ' — <a href="/">Tải lại</a></p>';
        return;
      }
      if (key && res.role !== 'teacher') {
        localStorage.removeItem('bw_key_' + code);
        key = '';
        toast('Sai mã giáo viên — đang vào với tư cách học sinh');
      }
      init(res);
    });
  });
  socket.on('disconnect', () => { $('#banner').hidden = false; });

  socket.on('item:add', ({ p, item }) => {
    if (!items[p]) return;
    items[p].push(item);
    if (p !== cur) return;
    if (item.t === 'text' || item.t === 'img') addDomEl(item); else drawItem(item, 0);
  });
  socket.on('stroke:append', ({ p, id, pts }) => {
    const it = findItem(id, p);
    if (!it || !it.pts) return;
    const old = it.pts.length;
    it.pts.push(...pts);
    if (p === cur) drawItem(it, old);
  });
  socket.on('item:update', ({ p, id, patch }) => {
    const it = findItem(id, p);
    if (!it) return;
    Object.assign(it, patch);
    if (p === cur) { const el = domEls[id]; if (el) { dom.removeChild(el); delete domEls[id]; addDomEl(it); } }
  });
  socket.on('item:remove', ({ p, id }) => removeLocal(p, id));
  socket.on('page:clear', ({ p }) => { items[p] = []; if (p === cur) { redraw(); renderDom(); } myStack = myStack.filter((s) => s.p !== p); });
  socket.on('pages:meta', (m) => {
    pages = m.pages;
    const ids = new Set(pages.map((p) => p.id));
    pages.forEach((p) => { if (!items[p.id]) items[p.id] = []; });
    Object.keys(items).forEach((i) => { if (!ids.has(i)) delete items[i]; });
    if (cur !== m.current) { vx = 0; vy = 0; zoomRel = 1; clampView(); }
    cur = m.current;
    select(null);
    renderTabs(); applyBg(); redraw(); renderDom();
  });
  socket.on('allowDraw', (v) => {
    allowDraw = v;
    document.body.classList.toggle('can-draw', v);
    $('#allowChk').checked = v;
    if (!isT()) { if (!v) setTool('laser'); else setTool('pen'); setTimeout(fit, 0); }
  });
  socket.on('laser', ({ x, y, on }) => {
    const l = $('#laser');
    if (!on) { l.style.display = 'none'; return; }
    l.style.display = 'block';
    l.style.left = (x - vx) * scale + 'px'; l.style.top = (y - vy) * scale + 'px';
    clearTimeout(l._t); l._t = setTimeout(() => { l.style.display = 'none'; }, 2500);
  });
  socket.on('chat', addChat);
  socket.on('users', (u) => { users = u; renderUsers(); });
  socket.on('hands', (h) => { hands = h; renderUsers(); });
  socket.on('voice', onVoice);
  socket.on('zap', ({ name }) => { zapEffect(); toast('⚡ ' + name + ' chích điện bạn! Làm lại đi 😆'); });
  socket.on('rtc:ready', ({ id }) => { if (micStream) callStudent(id); });
  socket.on('rtc:signal', async ({ from, data }) => {
    try {
      if (peers[from]) {
        const pc = peers[from];
        if (data.sdp) await setRemote(pc, data.sdp); else if (data.ice) addIce(pc, data.ice);
      } else if (data.sdp) {
        closeStudentPc();
        spc = new RTCPeerConnection(ICE);
        spc.ontrack = (e) => { $('#aud').srcObject = e.streams[0]; tryPlay(); };
        spc.onicecandidate = (e) => { if (e.candidate) socket.emit('rtc:signal', { to: from, data: { ice: e.candidate } }); };
        await setRemote(spc, data.sdp);
        await spc.setLocalDescription(await spc.createAnswer());
        socket.emit('rtc:signal', { to: from, data: { sdp: spc.localDescription } });
      } else if (data.ice && spc) addIce(spc, data.ice);
    } catch (e) { console.error('rtc', e); }
  });
}

/* ---------- khởi động ---------- */
function openJoin() {
  $('#nameIn').value = localStorage.getItem('bw_name') || '';
  $('#codeIn').value = '';
  $('#nameModal').hidden = false;
  ($('#nameIn').value ? $('#codeIn') : $('#nameIn')).focus();
}
function go() {
  const n = $('#nameIn').value.trim();
  const c = $('#codeIn').value.trim().toUpperCase();
  localStorage.setItem('bw_name', n || 'Khách');
  if (c) localStorage.setItem('bw_key_' + code, c);
  $('#nameModal').hidden = true;
  if (socket) { location.reload(); return; }
  key = c;
  myName = localStorage.getItem('bw_name');
  connect();
}
$('#joinBtn').onclick = go;
$('#nameIn').addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
$('#codeIn').addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
$('#codeBtn').onclick = openJoin;
$('#logoutBtn').onclick = () => {
  if (!confirm('Thôi làm giáo viên trên máy này?')) return;
  localStorage.removeItem('bw_key_' + code);
  location.reload();
};
$('#nameModal').addEventListener('click', (e) => { if (e.target.id === 'nameModal' && socket) $('#nameModal').hidden = true; });

myName = localStorage.getItem('bw_name') || '';
try {
  if (!localStorage.getItem('bw_hint2')) {
    localStorage.setItem('bw_hint2', '1');
    setTimeout(() => toast('Mẹo: dùng 2 ngón tay để kéo bảng lên/xuống và phóng to'), 1500);
  }
} catch (e) { /* bỏ qua */ }
if (key || myName) { myName = myName || 'Khách'; connect(); }
else openJoin();
fit();
})();
</script>
