<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Phụ đạo</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/mhchem.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#e2e8f0;color:#0f172a;font-size:14px;overflow:hidden}
button,select,input,textarea{font:inherit}
button{cursor:pointer}
[hidden]{display:none!important}

/* quyền */
.gone{display:none!important}
.tabEdit{font:inherit;outline:0;cursor:text}
body[data-role=student] .t-only{display:none!important}
body[data-role=teacher] .s-only{display:none!important}

/* thanh trên: tab trang + vài nút */
.top{display:flex;align-items:center;gap:4px;padding:4px 6px;background:#fff;border-bottom:1px solid #e2e8f0;min-height:44px}
.top h1{font-size:15px;margin:0 6px 0 2px;white-space:nowrap}
.badge{background:#e0e7ff;color:#3730a3;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600}
.grow{flex:1}
.btn{border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:6px 10px}
.btn:hover{background:#f1f5f9}
.btn.on{background:#fee2e2;border-color:#fca5a5;color:#b91c1c}
.btn.pri{background:#4f46e5;border-color:#4f46e5;color:#fff}
.btn.pri:hover{background:#4338ca}
label.chk{display:flex;align-items:center;gap:5px;cursor:pointer}
.ib{position:relative;flex:none;width:36px;height:36px;border:0;background:none;border-radius:9px;font-size:18px;padding:0;display:flex;align-items:center;justify-content:center}
.ib:hover{background:#f1f5f9}
.ib.on{background:#fee2e2}
.dot{position:absolute;top:5px;right:5px;width:9px;height:9px;border-radius:50%;background:#ef4444;border:2px solid #fff}
#count{flex:none;font-size:12px;color:#64748b;padding:0 4px;white-space:nowrap}

/* tab trang */
.tabs{flex:1;min-width:0;display:flex;gap:4px;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid #cbd5e1;background:#f8fafc;border-radius:8px;padding:5px 10px;height:32px}
.tab.on{background:#4f46e5;color:#fff;border-color:#4f46e5}
.tab .x{opacity:.8;margin-left:6px;padding:0 2px}

/* menu bật lên (màu, hình, thêm) */
.pop{position:fixed;z-index:60;background:#fff;border:1px solid #cbd5e1;border-radius:12px;box-shadow:0 8px 24px #0003;padding:8px;display:flex;flex-wrap:wrap;gap:6px;max-width:min(300px,94vw)}
.pop .full{width:100%;text-align:left}
.pop .rowp{display:flex;gap:6px;align-items:center;width:100%;flex-wrap:wrap}

/* vùng chính */
.main{flex:1;display:flex;min-height:0;position:relative;overflow:hidden}
.tools{display:none;flex-direction:column;align-items:center;justify-content:center;gap:3px;width:48px;padding:4px;background:#fff;border-right:1px solid #e2e8f0;overflow:auto;scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
body[data-role=teacher] .tools,body.can-draw .tools{display:flex}
.tb{flex:none;width:38px;height:36px;border:1px solid transparent;background:#fff;border-radius:9px;font-size:18px;padding:0;display:flex;align-items:center;justify-content:center}
.tb:hover{background:#f1f5f9}
.tb.on{background:#4f46e5;color:#fff;border-color:#4f46e5}
.tools hr{width:70%;border:0;border-top:1px solid #e2e8f0;margin:2px 0;flex:none}
.cdot{width:24px;height:24px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #94a3b8}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #cbd5e1;padding:0}
.sw.on{box-shadow:0 0 0 3px #4f46e5}
.wd{width:56px;height:32px;border:1px solid #e2e8f0;background:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0}
.wd i{display:block;width:30px;background:#111;border-radius:99px}
.wd.on{border-color:#4f46e5;background:#eef2ff}
input[type=color]{width:34px;height:30px;padding:0;border:1px solid #cbd5e1;border-radius:6px;background:none}

/* điện thoại dọc: thanh công cụ nằm ngang ngay dưới thanh trên */
@media (orientation:portrait){
  .main{flex-direction:column}
  .tools{flex-direction:row;width:auto;height:46px;padding:4px 6px;border-right:0;border-bottom:1px solid #e2e8f0;justify-content:safe center}
  .tools hr{width:1px;height:60%;border:0;border-left:1px solid #e2e8f0;margin:0 2px}
  .tools{gap:2px}
  .tb{width:32px}
}
/* điện thoại nằm ngang: thấp, nên thu nhỏ thanh trên và nút */
@media (orientation:landscape) and (max-height:500px){
  .top{min-height:38px;padding:2px 6px}
  .top h1{display:none}
  .ib{width:32px;height:32px;font-size:16px}
  .tab{height:28px;padding:3px 9px}
  /* màn hình thấp: xếp công cụ thành 2 cột để không bị che */
  body[data-role=teacher] .tools,body.can-draw .tools{display:grid}
  .tools{grid-template-columns:repeat(2,34px);grid-auto-rows:32px;gap:3px;width:auto;padding:4px;align-content:center;justify-content:center}
  .tb{width:34px;height:32px;font-size:16px}
  .tools hr{display:none}
}
.tools{justify-content:safe center}
#count{border:0;background:none;border-radius:9px;height:32px;cursor:pointer}
#count:hover{background:#f1f5f9}
.ulist{display:flex;flex-direction:column;gap:2px;min-width:160px}
.ulist div{padding:6px 8px;border-radius:6px;white-space:nowrap}
.ulist div::before{content:'🟢 '}
@media (max-width:500px){ .top h1{display:none} }

.area{flex:1;min-width:0;position:relative;background:#e2e8f0;overflow:hidden}
#stage{position:absolute;top:0;bottom:0;left:0;right:0;margin:0 auto;width:min(100%,760px);background-color:#fff;overflow:hidden;touch-action:none;box-shadow:0 0 18px #0f172a22}
.area{background:#e2e8f0}
.area{touch-action:none}
.bg-grid{background-image:linear-gradient(#cfe0f0 1px,transparent 1px),linear-gradient(90deg,#cfe0f0 1px,transparent 1px);background-size:var(--u) var(--u)}
.bg-lined{background-image:linear-gradient(#cfe0f0 1px,transparent 1px);background-size:100% calc(var(--u) * 1.5)}
#stage{background-position:var(--bx,0) var(--by,0)}
.bg-dots{background-image:radial-gradient(#b8c4d0 1.6px,transparent 1.7px);background-size:var(--u) var(--u)}
#cv{position:absolute;left:0;top:0;width:100%;height:100%}
#dom{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;pointer-events:none}
.ti{position:absolute;white-space:pre-wrap;line-height:1.35;padding:2px 4px;border:2px dashed transparent;font-family:"Times New Roman",serif;user-select:none}
.im{position:absolute;border:2px dashed transparent;user-select:none}
.im img{width:100%;height:100%;display:block;pointer-events:none;-webkit-user-drag:none}
.sel .ti,.sel .im{pointer-events:auto;cursor:move}
.selected{border-color:#4f46e5!important}
.ti.rm,.im.rm{transition:left .09s linear,top .09s linear,width .09s linear,height .09s linear,font-size .09s linear}
.hdl{position:absolute;right:calc(-14px * var(--inv,1));bottom:calc(-14px * var(--inv,1));width:calc(28px * var(--inv,1));height:calc(28px * var(--inv,1));border-radius:50%;background:#4f46e5;border:calc(3px * var(--inv,1)) solid #fff;box-shadow:0 1px 4px #0005;cursor:nwse-resize;touch-action:none;display:none}
.selected .hdl{display:block}
.selBar{position:absolute;z-index:16;display:flex;gap:2px;background:#fff;border-radius:12px;padding:3px;box-shadow:0 2px 10px #0003;transform:translateX(-50%)}
.selBar button{width:36px;height:34px;border:0;background:none;border-radius:9px;font-size:17px;cursor:pointer}
.selBar button:active{background:#e0e7ff}
.laser{position:absolute;width:18px;height:18px;border-radius:50%;background:#ef4444;box-shadow:0 0 12px 6px #ef444488;transform:translate(-50%,-50%);pointer-events:none;display:none}
.zapFlash{position:fixed;inset:0;z-index:150;pointer-events:none;background:radial-gradient(circle,#fff9 0%,#60a5fa66 40%,#facc1533 70%,transparent 100%);animation:zapF .7s steps(7) forwards}
@keyframes zapF{0%,28%,56%{opacity:1}14%,42%,70%{opacity:.15}100%{opacity:0}}
body.shake{animation:shake .6s}
@keyframes shake{0%,100%{transform:none}10%{transform:translate(-6px,3px)}20%{transform:translate(5px,-4px)}30%{transform:translate(-4px,-2px)}40%{transform:translate(6px,4px)}50%{transform:translate(-5px,2px)}60%{transform:translate(4px,-3px)}70%{transform:translate(-3px,3px)}80%{transform:translate(2px,-2px)}}
#zapBtn{font-size:19px}
.peerFrame{position:absolute;z-index:6;border:2px dashed #f59e0b;border-radius:6px;pointer-events:none;box-shadow:0 0 0 200vmax #0f172a12}
.peerFrame span{position:absolute;left:4px;top:-1px;transform:translateY(-100%);background:#f59e0b;color:#fff;font-size:11px;padding:1px 7px;border-radius:6px 6px 0 0;white-space:nowrap}
.rail{position:absolute;top:0;right:0;bottom:0;width:30px;z-index:14;touch-action:none;background:linear-gradient(90deg,transparent,#0f172a0d);cursor:pointer}
.rail .thumb{position:absolute;right:4px;width:20px;min-height:48px;border-radius:10px;background:#475569b3;box-shadow:0 1px 4px #0003;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;line-height:1}
.rail.drag .thumb{background:#2563ebd9}
.zoomInfo{position:absolute;right:36px;bottom:8px;background:#0f172acc;color:#fff;padding:6px 12px;border-radius:99px;font-size:12px;z-index:15;border:0;cursor:pointer}
.banner{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:#dc2626;color:#fff;padding:6px 14px;border-radius:99px;z-index:20}

/* bảng điểm */
#scoreBtn{flex:none;border:0;background:#fef3c7;color:#92400e;border-radius:99px;height:30px;padding:0 10px;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}
#scoreBtn:hover{background:#fde68a}
.scorePop{flex-direction:column;flex-wrap:nowrap;width:min(300px,94vw)}
.scBig{font-size:30px;font-weight:800;text-align:center;color:#b45309}
#scoreWhy{padding:8px;border:1px solid #cbd5e1;border-radius:8px;font-size:16px;width:100%}
.scBtns{display:flex;gap:6px}
.scorePop:not(.unlocked) .scBtns,.scorePop:not(.unlocked) #scoreWhy,.scorePop:not(.unlocked) .scLock{display:none}
.scorePop.unlocked .pinRow{display:none}
.pinRow{display:flex;gap:6px}
.pinRow input{flex:1;min-width:0;padding:8px;border:1px solid #cbd5e1;border-radius:8px;font-size:16px}
.scLock{border:0;background:none;color:#64748b;font-size:12px;cursor:pointer;align-self:flex-end;padding:0}
.scBtns button{flex:1;height:42px;border-radius:10px;border:0;font-size:17px;font-weight:700;cursor:pointer;background:#dcfce7;color:#166534}
.scBtns button.m{background:#fee2e2;color:#991b1b}
.scBtns button:active{transform:scale(.94)}
.scLog{max-height:210px;overflow:auto;font-size:13px}
.scLog div{display:flex;gap:6px;align-items:baseline;padding:5px 2px;border-top:1px solid #f1f5f9}
.scLog b{min-width:34px;color:#16a34a}
.scLog b.m{color:#dc2626}
.scLog small{color:#94a3b8;margin-left:auto;white-space:nowrap}
.scLog .empty{color:#94a3b8;justify-content:center;border:0}
.scFly{position:fixed;left:50%;top:40%;font-size:72px;font-weight:900;z-index:160;pointer-events:none;animation:scF 1.7s ease-out forwards;text-shadow:0 4px 18px #0004;white-space:nowrap}
@keyframes scF{0%{opacity:0;transform:translate(-50%,-30%) scale(.4)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}30%{transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-150%) scale(1)}}

/* hộp thoại */
.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:100;padding:12px}
.modal .card{background:#fff;border-radius:14px;padding:20px;width:min(380px,100%)}
.modal .card.wide{width:min(640px,100%);max-height:96vh;overflow:auto}
.modal h3{margin:0 0 10px}
.modal input[type=text],.modal textarea,.modal select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;margin-bottom:10px}
#codeIn::placeholder{text-transform:none}
.modal textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;resize:vertical}
.hint{color:#64748b;font-size:13px;margin-bottom:8px}
.hint code{background:#f1f5f9;padding:1px 5px;border-radius:4px}
.syms{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.syms button{border:1px solid #cbd5e1;background:#fff;border-radius:6px;padding:3px 8px;font-size:14px}
.syms button:hover{background:#eef2ff}
.prev{min-height:60px;max-height:160px;overflow:auto;border:1px dashed #cbd5e1;border-radius:8px;padding:8px;margin-bottom:10px;font-size:22px;white-space:pre-wrap;font-family:"Times New Roman",serif}
.row{display:flex;align-items:center;gap:8px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:8px 16px;border-radius:99px;z-index:200}

</style>
</head>
<body data-role="student">

<div class="top">
  <h1 id="title">Phụ đạo</h1>
  <div class="tabs" id="tabs"></div>
  <button id="count" title="Ai đang trong phòng">👥 0</button>
  <button id="scoreBtn" title="Bảng điểm">⭐ <span id="scoreVal">0</span></button>
  <button class="ib" id="saveBtn" title="Lưu cả trang bài tập về máy (ảnh PNG)">💾</button>
  <button class="ib" id="zapBtn" title="Chích điện người kia ⚡">⚡</button>
  <button class="ib" id="moreBtn" title="Thêm">⋯</button>

  <span class="badge gone" id="roleBadge">…</span>
  <label class="chk gone"><input type="checkbox" id="allowChk"> Cho HS viết</label>
  <button class="gone" id="logoutBtn"></button>
  <button class="gone" id="codeBtn"></button>
  <button class="gone" id="handBtn"></button>
</div>

<div class="pop" id="morePop" hidden>
  <select id="bgSel" class="btn full" title="Nền trang">
    <option value="blank">Nền trắng</option>
    <option value="grid">Ô ly</option>
    <option value="lined">Dòng kẻ</option>
    <option value="dots">Chấm</option>
  </select>
  <button class="btn full" id="linkBtn">🔗 Copy link</button>
</div>
<div class="pop scorePop" id="scorePop" hidden>
  <div class="scBig">⭐ <span id="scoreBig">0</span> điểm</div>
  <div class="pinRow"><input id="pinIn" type="password" inputmode="numeric" autocomplete="off" placeholder="Mã PIN để chấm điểm" maxlength="20"><button class="btn pri" id="pinOk">Mở</button></div>
  <input id="scoreWhy" placeholder="Lý do (không bắt buộc), vd: làm đúng bài 3" maxlength="60">
  <div class="scBtns">
    <button class="m" data-d="-5">−5</button><button class="m" data-d="-1">−1</button>
    <button data-d="1">+1</button><button data-d="5">+5</button><button data-d="10">+10</button>
  </div>
  <button class="scLock" id="scLock" title="Quên mã PIN trên máy này">🔒 Khóa máy này</button>
  <div class="scLog" id="scoreLog"></div>
</div>
<div class="pop" id="usersPop" hidden><div class="ulist" id="ulist"></div></div>
<div class="pop" id="shapePop" hidden>
  <button class="tb" data-tool="line" title="Đường thẳng">╱</button>
  <button class="tb" data-tool="dash" title="Đường thẳng nét đứt">┄</button>
  <button class="tb" data-tool="arrow" title="Mũi tên">➜</button>
  <button class="tb" data-tool="rect" title="Hình chữ nhật">▭</button>
  <button class="tb" data-tool="ellipse" title="Hình tròn / elip">◯</button>
</div>
<div class="pop" id="colorPop" hidden>
  <div class="rowp" id="swatches"></div>
  <div class="rowp">
    <button class="wd" data-w="3" title="Nét mảnh"><i style="height:2px"></i></button>
    <button class="wd on" data-w="6" title="Nét vừa"><i style="height:5px"></i></button>
    <button class="wd" data-w="12" title="Nét đậm"><i style="height:10px"></i></button>
    <input type="color" id="customColor" value="#111111" title="Màu khác">
  </div>
</div>

<div class="main">
  <div class="tools" id="tools">
    <button class="tb on" data-tool="pen" title="Bút">✏️</button>
    <button class="tb" data-tool="eraser" title="Tẩy">🧽</button>
    <button class="tb" id="shapeBtn" title="Hình: thẳng, nét đứt, mũi tên, chữ nhật, tròn">◯</button>
    <button class="tb" data-tool="text" title="Chữ / công thức">T</button>
    <button class="tb" id="imgBtn" title="Chèn ảnh đề bài (cũng có thể Ctrl+V)">🖼</button>
    <button class="tb" data-tool="select" title="Chọn / di chuyển / xóa">🖐</button>
    <button class="tb" data-tool="laser" title="Con trỏ laser">🔴</button>
    <button class="tb" id="colorBtn" title="Màu và độ đậm"><i class="cdot" id="cdot"></i></button>
    <hr>
    <button class="tb" id="undoBtn" title="Hoàn tác (Ctrl+Z)">↩</button>
    <button class="tb" id="clearBtn" title="Xóa cả trang">🗑</button>
    <input type="file" id="fileIn" accept="image/*" hidden>
  </div>

  <div class="area" id="area">
    <div id="stage" class="bg-blank">
      <canvas id="cv"></canvas>
      <div id="dom"></div>
      <div class="laser" id="laser"></div>
      <div class="peerFrame" id="peerFrame" hidden><span id="peerName"></span></div>
    </div>
    <div class="selBar" id="selBar" hidden>
      <button id="sbSmall" title="Nhỏ lại">➖</button><button id="sbBig" title="To lên">➕</button>
      <button id="sbRot" title="Xoay 90°">⟳</button><button id="sbFlip" title="Lật ngang">⇋</button>
      <button id="sbEdit" title="Sửa chữ">✎</button><button id="sbDel" title="Xóa">🗑</button>
    </div>
    <div class="rail" id="rail" title="Kéo để cuộn bảng lên/xuống"><div class="thumb" id="thumb">⇕</div></div>
    <button class="zoomInfo" id="zoomInfo" hidden title="Bấm để về đầu trang, cỡ vừa màn hình"></button>
    <div class="banner" id="banner" hidden>Mất kết nối, đang thử lại…</div>
  </div>

  <div class="gone" id="paneUsers"><span id="usersTab"></span><div id="userList"></div></div>
</div>


<div class="modal" id="nameModal" hidden>
  <div class="card">
    <h3>Vào lớp học</h3>
    <input type="text" id="nameIn" placeholder="Tên của bạn" maxlength="30">
    <input type="text" class="gone" id="codeIn" placeholder="Mã giáo viên (HS bỏ trống)" maxlength="20" autocomplete="off" style="text-transform:uppercase">
    <button class="btn pri" id="joinBtn" style="width:100%;padding:10px">Vào lớp</button>
  </div>
</div>

<div class="modal" id="editor" hidden>
  <div class="card wide">
    <h3>Chữ / công thức</h3>
    <div class="hint">Công thức đặt trong dấu <code>$…$</code>, ví dụ <code>$x^2+2x+1=0$</code>. Hóa học: <code>$\ce{2H2 + O2 -> 2H2O}$</code>. Bấm nút bên dưới để chèn nhanh.</div>
    <div class="syms" id="syms"></div>
    <textarea id="edText" rows="5" placeholder="Gõ nội dung..."></textarea>
    <div class="prev" id="edPrev"></div>
    <div class="row">
      <span>Cỡ chữ</span>
      <select id="edSize" style="width:auto;margin:0">
        <option value="28">Nhỏ</option><option value="40">Vừa</option>
        <option value="56">Lớn</option><option value="80" selected>Rất lớn</option>
      </select>
      <span class="grow"></span>
      <button class="btn" id="edCancel">Hủy</button>
      <button class="btn pri" id="edOk">Chèn</button>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';
const W = 1600, H = 900;
const $ = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);

/* ---------- trạng thái ---------- */
const code = 'LOP';
const hk = new URLSearchParams(location.hash.slice(1)).get('key');
if (hk) { localStorage.setItem('bw_key_' + code, hk); history.replaceState(null, '', location.pathname); }
let key = localStorage.getItem('bw_key_' + code) || '';

let socket = null;
let me = { id: '', role: 'student' };
let myName = '';
let pages = [], cur = null, items = {}, allowDraw = false;
let tool = 'pen', color = '#111111', width = 6;
let scale = 1, k = 1, vx = 0, vy = 0, zoomRel = 1, fitS = 1;
const MAXY = 20000; // trang dài như cuốn vở, kéo xuống bằng 2 ngón
let drawing = null, drawPage = null, pend = [], lastEmit = 0, lasering = false, lastLaser = 0;
let myStack = [], selId = null, drag = null, domEls = {};
let users = [], hands = [];

const isT = () => me.role === 'teacher';
const stage = $('#stage'), cv = $('#cv'), dom = $('#dom'), area = $('#area');
const ctx = cv.getContext('2d');
const COLORS = ['#111111', '#e11d48', '#2563eb', '#16a34a', '#f59e0b', '#7c3aed', '#0891b2'];

function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}

/* ---------- bố cục ---------- */
/* Bảng rộng W=1600 đơn vị, dài tới MAXY. Mặc định vừa khít chiều ngang màn hình,
   2 ngón tay để kéo lên/xuống và phóng to. */
function clampView() {
  const r = stage.getBoundingClientRect();
  zoomRel = Math.min(5, Math.max(zMin, zoomRel));
  scale = fitS * zoomRel;
  const vw = r.width / scale, vh = r.height / scale;
  if (vw >= W) vx = (W - vw) / 2; // bảng hẹp hơn màn hình: để giữa
  else vx = Math.min(Math.max(0, vx), W - vw);
  vy = Math.min(Math.max(0, vy), MAXY - vh);
}
function applyView() {
  clampView();
  stage.style.setProperty('--u', (40 * scale) + 'px');
  stage.style.setProperty('--bx', (-vx * scale) + 'px');
  stage.style.setProperty('--by', (-vy * scale) + 'px');
  dom.style.transform = 'translate(' + (-vx * scale) + 'px,' + (-vy * scale) + 'px) scale(' + scale + ')';
  k = (window.devicePixelRatio || 1) * scale;
  redraw();
  const zi = $('#zoomInfo');
  if (zi) {
    zi.hidden = zoomRel < 1.05 && vy < 5;
    zi.textContent = (zoomRel >= 1.05 ? Math.round(zoomRel * 100) + '% · ' : '') + 'Dòng ' + Math.round(vy / 40 + 1) + '  ⤒';
  }
  updRail();
  placePeer();
  dom.style.setProperty('--inv', 1 / scale);
  if (drag && !drag.resize) dragTo(); else placeSelBar();
  sendView();
}
/* ---- màn hình người kia cuộn theo mình ---- */
/* Mỗi người gửi đúng vùng bảng mình đang thấy. Máy kia thu phóng để thấy trọn vùng đó
   (màn hình khác cỡ vẫn thấy giống nhau) và vẽ khung cam đánh dấu. */
let remoteView = false, lastView = '', viewT = null, pendView = null, peer = null, zMin = 1;
function myRect() {
  const vw = stage.clientWidth / scale, vh = stage.clientHeight / scale;
  const x = Math.max(0, vx), y = Math.max(0, vy);
  return { x: Math.round(x), y: Math.round(y), w: Math.round(Math.min(W, vx + vw) - x), h: Math.round(vh) };
}
function sendView() {
  if (remoteView || !socket || !cur) return;
  const m = myRect();
  const key = cur + ':' + m.x + ':' + m.y + ':' + m.w + ':' + m.h;
  if (key === lastView) return;
  lastView = key;
  if (peer) { peer = null; placePeer(); } // mình tự cuộn: thôi theo người kia
  if (viewT) return;
  viewT = setTimeout(() => { viewT = null; socket.emit('view', { p: cur, ...myRect() }); }, 60);
}
function placePeer() {
  const f = $('#peerFrame');
  if (!f) return;
  if (!peer || peer.p !== cur) { f.hidden = true; return; }
  const vw = stage.clientWidth / scale, vh = stage.clientHeight / scale, t = 6 / scale;
  // vùng người kia gần trùng màn hình mình thì khỏi vẽ khung
  if (peer.x <= Math.max(0, vx) + t && peer.y <= vy + t && peer.x + peer.w >= Math.min(W, vx + vw) - t && peer.y + peer.h >= vy + vh - t) { f.hidden = true; return; }
  f.hidden = false;
  f.style.left = (peer.x - vx) * scale + 'px'; f.style.top = (peer.y - vy) * scale + 'px';
  f.style.width = peer.w * scale + 'px'; f.style.height = peer.h * scale + 'px';
  $('#peerName').textContent = 'Màn hình của ' + (peer.name || 'bên kia');
}
function busy() { return drawing || drag || touches.size > 0 || $('#rail').classList.contains('drag'); }
function takeView(v) {
  if (v.p !== cur) return;
  if (busy()) { pendView = v; return; }
  pendView = null;
  peer = v;
  // thu phóng sao cho thấy trọn vùng người kia, đặt vào giữa
  const aw = stage.clientWidth, ah = stage.clientHeight;
  const s = Math.min(aw / v.w, ah / v.h);
  zoomRel = s / fitS;
  zMin = Math.min(1, zoomRel);
  scale = fitS * zoomRel;
  vx = v.x + v.w / 2 - aw / scale / 2;
  vy = Math.max(0, v.y + v.h / 2 - ah / scale / 2);
  if (vy > v.y) vy = v.y;
  remoteView = true; applyView(); remoteView = false;
  const m = myRect();
  lastView = cur + ':' + m.x + ':' + m.y + ':' + m.w + ':' + m.h;
}
window.addEventListener('pointerup', () => setTimeout(() => { if (pendView && !busy()) takeView(pendView); }, 80));
/* thanh cuộn bên phải: chiều dài theo phần đã viết + thêm 1 màn hình trống bên dưới */
function contentBottom() {
  let m = 0;
  (items[cur] || []).forEach((it) => {
    if (it.pts) { for (let i = 1; i < it.pts.length; i += 2) if (it.pts[i] > m) m = it.pts[i]; }
    else if (it.y2 != null) m = Math.max(m, it.y1, it.y2);
    else if (it.y != null) m = Math.max(m, it.y + (it.h || 60));
  });
  return m;
}
let railMax = 0;
function updRail() {
  const rail = $('#rail'), th = $('#thumb');
  if (!rail) return;
  const vh = stage.clientHeight / scale;
  if (!rail.classList.contains('drag')) railMax = Math.min(MAXY, Math.max(contentBottom() + vh, vy + vh * 1.5, vh * 2.5));
  const H = rail.clientHeight;
  const tH = Math.max(48, H * vh / railMax);
  th.style.height = tH + 'px';
  th.style.top = ((H - tH) * vy / Math.max(1, railMax - vh)) + 'px';
}
(() => {
  const rail = $('#rail'), th = $('#thumb');
  let grab = null;
  const setFromY = (clientY) => {
    const r = rail.getBoundingClientRect(), tH = th.offsetHeight;
    const vh = stage.clientHeight / scale;
    const f = Math.min(1, Math.max(0, (clientY - r.top - grab) / Math.max(1, r.height - tH)));
    vy = f * (railMax - vh);
    applyView();
  };
  rail.addEventListener('pointerdown', (e) => {
    e.stopPropagation(); e.preventDefault();
    const tr = th.getBoundingClientRect();
    // chạm vào nút kéo: giữ đúng chỗ đang cầm; chạm vào rãnh: nút nhảy tới đó
    grab = (e.clientY >= tr.top && e.clientY <= tr.bottom) ? e.clientY - tr.top : th.offsetHeight / 2;
    rail.classList.add('drag');
    try { rail.setPointerCapture(e.pointerId); } catch (er) { /* bỏ qua */ }
    setFromY(e.clientY);
  });
  rail.addEventListener('pointermove', (e) => { if (grab != null) { e.stopPropagation(); setFromY(e.clientY); } });
  const end = () => { if (grab == null) return; grab = null; rail.classList.remove('drag'); updRail(); };
  rail.addEventListener('pointerup', end);
  rail.addEventListener('pointercancel', end);
})();
function fit() {
  const r = stage.getBoundingClientRect();
  if (r.width < 10 || r.height < 10) return;
  fitS = r.width / W;
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(r.width * dpr);
  cv.height = Math.round(r.height * dpr);
  remoteView = true; applyView(); remoteView = false;
}
function resetView() { vx = 0; vy = 0; zoomRel = 1; zMin = 1; applyView(); }
$('#zoomInfo').onclick = resetView;
$('#zoomInfo').addEventListener('pointerdown', (e) => e.stopPropagation());
new ResizeObserver(() => fit()).observe(area);

/* ---------- vẽ canvas ---------- */
function drawItem(it, from, g) {
  g = g || ctx;
  if (it.t === 'text' || it.t === 'img') return;
  g.save();
  g.lineCap = 'round'; g.lineJoin = 'round'; g.lineWidth = it.w;
  if (it.t === 'eraser') { g.globalCompositeOperation = 'destination-out'; g.strokeStyle = '#000'; }
  else g.strokeStyle = it.c;
  g.beginPath();
  if (it.t === 'pen' || it.t === 'eraser') {
    const p = it.pts;
    if (p.length <= 2) { g.moveTo(p[0], p[1]); g.lineTo(p[0] + 0.01, p[1]); }
    else {
      const s = from >= 2 ? from - 2 : 0;
      g.moveTo(p[s], p[s + 1]);
      for (let i = s + 2; i < p.length; i += 2) g.lineTo(p[i], p[i + 1]);
    }
  } else if (it.t === 'line' || it.t === 'arrow' || it.t === 'dash') {
    if (it.t === 'dash') g.setLineDash([it.w * 3 + 6, it.w * 2 + 6]);
    g.moveTo(it.x1, it.y1); g.lineTo(it.x2, it.y2);
    if (it.t === 'arrow') {
      const a = Math.atan2(it.y2 - it.y1, it.x2 - it.x1), hl = 14 + it.w * 2;
      g.moveTo(it.x2, it.y2); g.lineTo(it.x2 - hl * Math.cos(a - 0.45), it.y2 - hl * Math.sin(a - 0.45));
      g.moveTo(it.x2, it.y2); g.lineTo(it.x2 - hl * Math.cos(a + 0.45), it.y2 - hl * Math.sin(a + 0.45));
    }
  } else if (it.t === 'rect') {
    g.rect(Math.min(it.x1, it.x2), Math.min(it.y1, it.y2), Math.abs(it.x2 - it.x1), Math.abs(it.y2 - it.y1));
  } else if (it.t === 'ellipse') {
    g.ellipse((it.x1 + it.x2) / 2, (it.y1 + it.y2) / 2, Math.abs(it.x2 - it.x1) / 2, Math.abs(it.y2 - it.y1) / 2, 0, 0, Math.PI * 2);
  }
  g.stroke();
  g.restore();
}
function redraw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.setTransform(k, 0, 0, k, -vx * k, -vy * k);
  (items[cur] || []).forEach((it) => drawItem(it, 0));
  if (vx < 0) {
    ctx.fillStyle = '#e2e8f0';
    ctx.fillRect(vx - 5, vy - 5, -vx + 5, MAXY);
    ctx.fillRect(W, vy - 5, -vx + 5, MAXY);
  }
}

/* ---------- chữ / công thức / ảnh (lớp DOM) ---------- */
function renderRich(el, txt) {
  el.textContent = '';
  const parts = String(txt).split(/(\$\$[\s\S]+?\$\$|\$[^$]+?\$)/g);
  for (const p of parts) {
    if (!p) continue;
    if (p[0] === '$' && p.length > 2 && window.katex) {
      const d = p.startsWith('$$');
      const sp = document.createElement(d ? 'div' : 'span');
      try { katex.render(p.slice(d ? 2 : 1, d ? -2 : -1), sp, { displayMode: d, throwOnError: false }); }
      catch (e) { sp.textContent = p; }
      el.appendChild(sp);
    } else el.appendChild(document.createTextNode(p));
  }
}
function posEl(el, it) {
  el.style.left = it.x + 'px'; el.style.top = it.y + 'px';
  if (it.t === 'img') { el.style.width = it.w + 'px'; el.style.height = it.h + 'px'; }
}
function addDomEl(it) {
  const el = document.createElement('div');
  el.dataset.id = it.id;
  if (it.t === 'text') {
    el.className = 'ti';
    el.style.fontSize = it.size + 'px'; el.style.color = it.c;
    renderRich(el, it.content);
  } else {
    el.className = 'im';
    const im = new Image(); im.src = it.src; el.appendChild(im);
  }
  const h = document.createElement('i');
  h.className = 'hdl';
  el.appendChild(h);
  posEl(el, it);
  if (it.id === selId) el.classList.add('selected');
  dom.appendChild(el);
  domEls[it.id] = el;
}
function renderDom() {
  dom.textContent = ''; domEls = {};
  (items[cur] || []).forEach((it) => { if (it.t === 'text' || it.t === 'img') addDomEl(it); });
}
const findItem = (id, p) => (items[p || cur] || []).find((i) => i.id === id);

/* ---------- thêm / xóa mục ---------- */
function addLocal(it) {
  it.author = me.id;
  items[cur].push(it);
  myStack.push({ p: cur, id: it.id });
  socket.emit('item:add', { p: cur, item: it });
  if (it.t === 'text' || it.t === 'img') addDomEl(it); else drawItem(it, 0);
}
function removeLocal(p, id) {
  if (!items[p]) return;
  items[p] = items[p].filter((i) => i.id !== id);
  if (p === cur) { redraw(); renderDom(); placeSelBar(); }
}
function undo() {
  const s = myStack.pop();
  if (!s) return;
  removeLocal(s.p, s.id);
  socket.emit('item:remove', { p: s.p, id: s.id });
}
$('#undoBtn').onclick = undo;
$('#clearBtn').onclick = () => socket.emit('page:clear', { id: cur });

/* ---------- công cụ ---------- */
function setTool(t) {
  tool = t;
  $$('.tb[data-tool]').forEach((b) => b.classList.toggle('on', b.dataset.tool === t));
  stage.classList.toggle('sel', t === 'select');
  cv.style.cursor = !canDrawNow() || t === 'select' ? 'default' : t === 'text' ? 'text' : 'crosshair';
  if (t !== 'select') select(null);
  const shp = { line: '╱', dash: '┄', arrow: '➜', rect: '▭', ellipse: '◯' }[t];
  if (shp) $('#shapeBtn').textContent = shp;
  $('#shapeBtn').classList.toggle('on', !!shp);
  closePops();
}
$$('.tb[data-tool]').forEach((b) => (b.onclick = () => setTool(b.dataset.tool)));
function setColor(c) {
  color = c;
  $$('#swatches .sw').forEach((s) => s.classList.toggle('on', s.dataset.c === c));
  $('#customColor').value = c;
  $('#cdot').style.background = c;
}
COLORS.forEach((c) => {
  const b = document.createElement('button');
  b.className = 'sw'; b.style.background = c; b.dataset.c = c;
  b.onclick = () => setColor(c);
  $('#swatches').appendChild(b);
});
$('#customColor').oninput = (e) => setColor(e.target.value);
$$('.wd').forEach((b) => (b.onclick = () => {
  width = +b.dataset.w;
  $$('.wd').forEach((x) => x.classList.toggle('on', x === b));
  closePops();
}));

$$('#swatches .sw').forEach((b) => b.addEventListener('click', () => { if (tool === 'eraser' || tool === 'select' || tool === 'laser') setTool('pen'); closePops(); }));

/* menu bật lên cạnh nút */
function closePops() { $$('.pop').forEach((p) => { p.hidden = true; }); }
function openPop(pop, btn) {
  const was = !pop.hidden;
  closePops();
  if (was) return;
  pop.hidden = false;
  const r = btn.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight;
  const vertical = btn.closest('.tools') && getComputedStyle($('#tools')).flexDirection === 'column';
  let x, y;
  if (vertical) { x = r.right + 6; y = Math.min(r.top, innerHeight - h - 6); }
  else { x = Math.min(Math.max(6, r.left + r.width / 2 - w / 2), innerWidth - w - 6); y = r.bottom + 6; }
  pop.style.left = x + 'px'; pop.style.top = Math.max(6, y) + 'px';
}
$('#shapeBtn').onclick = (e) => { e.stopPropagation(); openPop($('#shapePop'), e.currentTarget); };
$('#colorBtn').onclick = (e) => { e.stopPropagation(); openPop($('#colorPop'), e.currentTarget); };
$('#moreBtn').onclick = (e) => { e.stopPropagation(); openPop($('#morePop'), e.currentTarget); };
$('#count').onclick = (e) => { e.stopPropagation(); openPop($('#usersPop'), e.currentTarget); };
try { localStorage.removeItem('bw_topHidden'); } catch (er) { /* bỏ qua */ }
$$('.pop').forEach((p) => p.addEventListener('click', (e) => e.stopPropagation()));
document.addEventListener('click', closePops);
document.addEventListener('pointerdown', (e) => { if (!e.target.closest('.pop') && !e.target.closest('#shapeBtn,#colorBtn,#moreBtn,#count,#scoreBtn')) closePops(); });
setColor(color);

const toV = (e) => {
  const r = stage.getBoundingClientRect();
  return { x: Math.round(((e.clientX - r.left) / scale + vx) * 10) / 10, y: Math.round(((e.clientY - r.top) / scale + vy) * 10) / 10 };
};

/* ---------- 2 ngón tay: kéo + phóng to; con lăn chuột: kéo, Ctrl+lăn: phóng to ---------- */
const touches = new Map();
let pinch = null;
function startPinch() {
  const [a, b] = [...touches.values()];
  const r = stage.getBoundingClientRect();
  const mx = (a.x + b.x) / 2 - r.left, my = (a.y + b.y) / 2 - r.top;
  pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, z: zoomRel, zooming: false, bx: mx / scale + vx, by: my / scale + vy };
}
function cancelStroke() {
  // ngón thứ 2 chạm vào: bỏ nét vừa bắt đầu của ngón 1 (nếu còn ngắn) để không vẽ bậy
  if (lasering) { lasering = false; sendLaser({ x: 0, y: 0 }, false); }
  if (!drawing) return;
  if (drawing.pts) {
    if (drawing.pts.length <= 40) {
      removeLocal(drawPage, drawing.id);
      socket.emit('item:remove', { p: drawPage, id: drawing.id });
      myStack = myStack.filter((x) => x.id !== drawing.id);
    } else flush();
  }
  drawing = null;
  redraw();
}
area.addEventListener('pointerdown', (e) => {
  if (e.pointerType !== 'touch' || e.target.closest('.rail')) return;
  touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (touches.size === 2) { cancelStroke(); drag = null; startPinch(); }
}, true);
area.addEventListener('pointermove', (e) => {
  if (!touches.has(e.pointerId)) return;
  touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (!pinch || touches.size < 2) return;
  e.stopPropagation();
  const [a, b] = [...touches.values()];
  const r = stage.getBoundingClientRect();
  const mx = (a.x + b.x) / 2 - r.left, my = (a.y + b.y) / 2 - r.top;
  const dist = Math.hypot(a.x - b.x, a.y - b.y) || 1;
  if (!pinch.zooming && Math.abs(dist / pinch.d - 1) > 0.15) { pinch.zooming = true; pinch.d = dist; pinch.z = zoomRel; }
  if (pinch.zooming) zoomRel = Math.min(5, Math.max(zMin, pinch.z * dist / pinch.d));
  scale = fitS * zoomRel;
  vx = pinch.bx - mx / scale; vy = pinch.by - my / scale;
  applyView();
}, true);
const touchEnd = (e) => {
  if (!touches.delete(e.pointerId)) return;
  if (touches.size < 2) pinch = null;
};
area.addEventListener('pointerup', touchEnd, true);
// iPhone: chặn phóng to cả trang khi chụm 2 ngón
['gesturestart', 'gesturechange'].forEach((ev) => document.addEventListener(ev, (e) => e.preventDefault()));
area.addEventListener('pointercancel', touchEnd, true);
area.addEventListener('wheel', (e) => {
  if (e.defaultPrevented) return;
  e.preventDefault();
  const r = stage.getBoundingClientRect();
  if (e.ctrlKey) {
    const mx = e.clientX - r.left, my = e.clientY - r.top;
    const bx = mx / scale + vx, by = my / scale + vy;
    zoomRel *= Math.exp(-e.deltaY * 0.01);
    zoomRel = Math.min(5, Math.max(zMin, zoomRel));
    scale = fitS * zoomRel;
    vx = bx - mx / scale; vy = by - my / scale;
  } else {
    const f = e.deltaMode === 1 ? 40 : 1;
    vx += e.deltaX * f / scale; vy += e.deltaY * f / scale;
  }
  applyView();
}, { passive: false });
const canDrawNow = () => isT() || (allowDraw && (tool === 'pen' || tool === 'text'));

function sendLaser(pt, on) { socket.emit('laser', { x: pt.x, y: pt.y, on }); }
function flush() {
  if (drawing && pend.length) {
    socket.emit('stroke:append', { p: drawPage, id: drawing.id, pts: pend });
    pend = [];
  }
  lastEmit = performance.now();
}

cv.addEventListener('pointerdown', (e) => {
  if (e.button > 0 || touches.size > 1) return;
  if (tool === 'select') { select(null); return; }
  if (!canDrawNow() || !cur) return;
  const pt = toV(e);
  if (tool === 'text') { openEditor(pt, null); return; }
  if (tool === 'laser') { lasering = true; try { cv.setPointerCapture(e.pointerId); } catch (er) { /* bỏ qua */ } sendLaser(pt, true); return; }
  try { cv.setPointerCapture(e.pointerId); } catch (er) { /* bỏ qua */ }
  drawPage = cur;
  const id = uid();
  if (tool === 'pen' || tool === 'eraser') {
    drawing = { id, t: tool, c: color, w: tool === 'eraser' ? width * 4 : width, pts: [pt.x, pt.y], author: me.id };
    items[cur].push(drawing);
    myStack.push({ p: cur, id });
    socket.emit('item:add', { p: cur, item: { ...drawing, pts: [...drawing.pts] } });
    drawItem(drawing, 0);
    pend = []; lastEmit = performance.now();
  } else {
    drawing = { id, t: tool, c: color, w: width, x1: pt.x, y1: pt.y, x2: pt.x, y2: pt.y, author: me.id };
  }
});
cv.addEventListener('pointermove', (e) => {
  if (pinch) return;
  if (lasering) {
    const now = performance.now();
    if (now - lastLaser > 30) { lastLaser = now; sendLaser(toV(e), true); }
    return;
  }
  if (!drawing) return;
  const pt = toV(e);
  if (drawing.pts) {
    const n = drawing.pts.length;
    const dx = pt.x - drawing.pts[n - 2], dy = pt.y - drawing.pts[n - 1];
    if (dx * dx + dy * dy < 1) return;

  const add = (ax, ay, bx, by) => { x0 = Math.min(x0, ax); y0 = Math.min(y0, ay); x1 = Math.max(x1, bx); y1 = Math.max(y1, by); };
  (items[cur] || []).forEach((it) => {
    if (it.t === 'text' || it.t === 'img' || it.t === 'eraser') return;
    const w = (it.w || 4) + 20;
    if (it.pts) { for (let i = 0; i < it.pts.length; i += 2) add(it.pts[i] - w, it.pts[i + 1] - w, it.pts[i] + w, it.pts[i + 1] + w); }
    else add(Math.min(it.x1, it.x2) - w, Math.min(it.y1, it.y2) - w, Math.max(it.x1, it.x2) + w, Math.max(it.y1, it.y2) + w);
  });
  Object.values(domEls).forEach((el) => {
    const l = parseFloat(el.style.left) || 0, t = parseFloat(el.style.top) || 0;
    add(l - 10, t - 10, l + el.offsetWidth + 10, t + el.offsetHeight + 10);
  });
  y1 = Math.max(y1 + 60, 600);
  return { x0: Math.floor(x0), y0: Math.floor(y0), w: Math.ceil(x1 - x0), h: Math.ceil(y1 - y0) };
}
function drawBg(g, bg, b, sc) {
  g.fillStyle = '#fff'; g.fillRect(0, 0, b.w * sc, b.h * sc);
  if (bg === 'blank') return;
  g.save(); g.scale(sc, sc); g.translate(-b.x0, -b.y0);
  const sx = Math.floor(b.x0 / 40) * 40, sy = Math.floor(b.y0 / 40) * 40, ex = b.x0 + b.w, ey = b.y0 + b.h;
  g.strokeStyle = '#cfe0f0'; g.fillStyle = '#b8c4d0'; g.lineWidth = 1.5;
  g.beginPath();
  if (bg === 'grid') {
    for (let x = sx; x <= ex; x += 40) { g.moveTo(x, b.y0); g.lineTo(x, ey); }
    for (let y = sy; y <= ey; y += 40) { g.moveTo(b.x0, y); g.lineTo(ex, y); }
    g.stroke();
  } else if (bg === 'lined') {
    for (let y = Math.floor(b.y0 / 60) * 60; y <= ey; y += 60) { g.moveTo(b.x0, y); g.lineTo(ex, y); }
    g.stroke();
  } else if (bg === 'dots') {
    for (let x = sx; x <= ex; x += 40) for (let y = sy; y <= ey; y += 40) { g.moveTo(x + 2, y); g.arc(x, y, 2, 0, Math.PI * 2); }
    g.fill();
  }
  g.restore();
}
let saving = false;
async function savePage() {
  if (saving || !cur) return;
  saving = true;
  toast('Đang lưu bài…');
  let box = null;
  try {
    if (!window.html2canvas) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    const b = pageBounds();
    const sc = Math.min(1, 14000 / b.h);
    const out = document.createElement('canvas');
    out.width = Math.round(b.w * sc); out.height = Math.round(b.h * sc);
    const g = out.getContext('2d');
    const pg = pages.find((x) => x.id === cur) || {};
    drawBg(g, pg.bg || 'blank', b, sc);
    // nét vẽ (tẩy chỉ xóa nét, không xóa nền)
    const sk = document.createElement('canvas');
    sk.width = out.width; sk.height = out.height;
    const sg = sk.getContext('2d');
    sg.setTransform(sc, 0, 0, sc, -b.x0 * sc, -b.y0 * sc);
    (items[cur] || []).forEach((it) => drawItem(it, 0, sg));
    g.drawImage(sk, 0, 0);
    // chữ, công thức, ảnh
    if (Object.keys(domEls).length) {
      box = document.createElement('div');
      box.style.cssText = 'position:absolute;left:-30000px;top:0;overflow:hidden;width:' + b.w + 'px;height:' + b.h + 'px';
      const cl = dom.cloneNode(true);
      cl.removeAttribute('id');
      cl.style.cssText = 'position:absolute;left:' + (-b.x0) + 'px;top:' + (-b.y0) + 'px;width:' + W + 'px;height:' + b.h + 'px;transform:none';
      cl.querySelectorAll('.hdl').forEach((h) => h.remove());
      cl.querySelectorAll('.selected,.rm').forEach((e) => e.classList.remove('selected', 'rm'));
      box.appendChild(cl);
      document.body.appendChild(box);
      const dc = await html2canvas(box, { backgroundColor: null, scale: sc, logging: false, useCORS: true, width: b.w, height: b.h, windowWidth: b.w, windowHeight: b.h });
      g.drawImage(dc, 0, 0, out.width, out.height);
    }
    const blob = await new Promise((r) => out.toBlob(r, 'image/png'));
    const d = new Date(), pad = (n) => String(n).padStart(2, '0');
    const fname = ($('#title').textContent || 'Bai') + ' - ' + (pg.name || 'Trang') + ' - ' + d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + 'h' + pad(d.getMinutes()) + '.png';
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = fname;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    toast('💾 Đã lưu: ' + fname);
  } catch (e) {
    console.error(e);
    toast('Không lưu được, thử lại nhé');
  } finally {
    if (box) box.remove();
    saving = false;
  }
}
$('#saveBtn').onclick = savePage;

/* ---------- ⭐ bảng điểm ----------
   Điểm lưu trên server (rooms.json) và có bản sao trong trình duyệt mỗi máy.
   Server trên mạng khởi động lại mà mất file thì máy nào vào trước sẽ gửi lại bản sao mới nhất. */
let score = { total: 0, log: [], updated: 0 };
function renderScore() {
  $('#scoreVal').textContent = score.total;
  $('#scoreBig').textContent = score.total;
  const box = $('#scoreLog');
  box.textContent = '';
  if (!score.log.length) { const e = document.createElement('div'); e.className = 'empty'; e.textContent = 'Chưa có lần cộng/trừ nào'; box.appendChild(e); return; }
  const pad = (n) => String(n).padStart(2, '0');
  score.log.slice(0, 40).forEach((e) => {
    const row = document.createElement('div');
    const b = document.createElement('b');
    b.textContent = (e.d > 0 ? '+' : '') + e.d;
    if (e.d < 0) b.className = 'm';
    const w = document.createElement('span');
    w.textContent = e.why || (e.d > 0 ? 'Làm tốt' : 'Chưa tốt');
    const t = new Date(e.t), sm = document.createElement('small');
    sm.textContent = pad(t.getHours()) + ':' + pad(t.getMinutes()) + ' ' + pad(t.getDate()) + '/' + pad(t.getMonth() + 1);
    sm.title = 'Bởi ' + e.by;
    row.append(b, w, sm);
    box.appendChild(row);
  });
}
function setScore(s, fx) {
  if (!s) return;
  score = { total: s.total || 0, log: s.log || [], updated: s.updated || 0 };
  renderScore();
  try { localStorage.setItem('bw_score', JSON.stringify(score)); } catch (e) { /* bỏ qua */ }
  if (fx && s.last) scoreFx(s.last);
}
function scoreSound(up) {
  const a = getAC();
  if (!a) return;
  const t = a.currentTime;
  (up ? [660, 880, 1320] : [300, 200]).forEach((f, i) => {
    const o = a.createOscillator(), g = a.createGain();
    o.type = up ? 'triangle' : 'sawtooth';
    o.frequency.value = f;
    const s0 = t + i * (up ? 0.09 : 0.16);
    g.gain.setValueAtTime(0.0001, s0);
    g.gain.exponentialRampToValueAtTime(up ? 0.25 : 0.15, s0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, s0 + (up ? 0.35 : 0.3));
    o.connect(g); g.connect(a.destination); o.start(s0); o.stop(s0 + 0.4);
  });
}
function scoreFx(e) {
  const up = e.d > 0;
  const f = document.createElement('div');
  f.className = 'scFly';
  f.style.color = up ? '#16a34a' : '#dc2626';
  f.textContent = (up ? '+' : '') + e.d + (up ? ' ⭐' : ' 😢');
  document.body.appendChild(f);
  setTimeout(() => f.remove(), 1800);
  scoreSound(up);
  toast((e.by === myName ? 'Bạn' : e.by) + (up ? ' cộng ' : ' trừ ') + Math.abs(e.d) + ' điểm' + (e.why ? ': ' + e.why : '') + ' · Tổng ' + score.total);
}
// chỉ máy đã nhập đúng mã PIN mới được cộng/trừ (máy em chỉ xem)
let pin = '';
try { pin = localStorage.getItem('bw_pin') || ''; } catch (e) { pin = ''; }
function setPin(v) {
  pin = v;
  try { if (v) localStorage.setItem('bw_pin', v); else localStorage.removeItem('bw_pin'); } catch (e) { /* bỏ qua */ }
  $('#scorePop').classList.toggle('unlocked', !!v);
}
setPin(pin);
function tryPin() {
  const v = $('#pinIn').value.trim();
  if (!v || !socket) return;
  socket.emit('score:pin', { pin: v }, (r) => {
    if (r && r.ok) { setPin(v); $('#pinIn').value = ''; toast('🔓 Máy này đã được chấm điểm'); }
    else { $('#pinIn').value = ''; toast('Sai mã PIN'); }
  });
}
$('#pinOk').onclick = tryPin;
$('#pinIn').addEventListener('keydown', (e) => { if (e.key === 'Enter') tryPin(); });
$('#scLock').onclick = () => { setPin(''); toast('🔒 Đã khóa chấm điểm trên máy này'); };
$$('#scorePop .scBtns button').forEach((b) => (b.onclick = () => {
  if (!socket || !pin) return;
  socket.emit('score:add', { d: +b.dataset.d, why: $('#scoreWhy').value, pin }, (r) => {
    if (r && r.error === 'pin') { setPin(''); toast('Mã PIN đã đổi, nhập lại nhé'); }
  });
  $('#scoreWhy').value = '';
}));
$('#scoreBtn').onclick = (e) => { e.stopPropagation(); openPop($('#scorePop'), e.currentTarget); };
renderScore();

/* ---------- socket ---------- */
function init(res) {
  me = { id: res.id, role: res.role };
  document.body.dataset.role = me.role;
  $('#roleBadge').textContent = isT() ? 'Giáo viên' : 'Học sinh';
  $('#title').textContent = res.title;
  document.title = res.title;
  pages = res.state.pages.map((p) => ({ id: p.id, name: p.name, bg: p.bg }));
  items = {};
  res.state.pages.forEach((p) => { items[p.id] = p.items; });
  if (cur !== res.state.current) { vx = 0; vy = 0; zoomRel = 1; }
  cur = res.state.current;
  allowDraw = res.state.allowDraw;
  document.body.classList.toggle('can-draw', allowDraw);
  $('#allowChk').checked = allowDraw;
  if (!isT() && !allowDraw) setTool('laser'); else if (!isT() && tool !== 'pen' && tool !== 'text') setTool('pen');
  users = res.users; hands = res.hands;
  let loc = null;
  try { loc = JSON.parse(localStorage.getItem('bw_score') || 'null'); } catch (e) { loc = null; }
  const srv = res.score || { total: 0, log: [], updated: 0 };
  if (loc && loc.updated > (srv.updated || 0)) { setScore(loc); socket.emit('score:restore', loc); } else setScore(srv);
  select(null); myStack = [];
  renderTabs(); applyBg(); renderUsers(); fit(); renderDom();
  $('#banner').hidden = true;
}

function connect() {
  socket = io();
  socket.on('connect', () => {
    socket.emit('join', { code, key, name: myName }, (res) => {
      if (res.error) {
        document.body.innerHTML = '<p style="padding:40px;font:18px sans-serif">' + res.error + ' — <a href="/">Tải lại</a></p>';
        return;
      }
      if (key && res.role !== 'teacher') {
        localStorage.removeItem('bw_key_' + code);
        key = '';
        toast('Sai mã giáo viên — đang vào với tư cách học sinh');
      }
      init(res);
    });
  });
  socket.on('disconnect', () => { $('#banner').hidden = false; });

  socket.on('item:add', ({ p, item }) => {
    if (!items[p]) return;
    items[p].push(item);
    if (p !== cur) return;
    if (item.t === 'text' || item.t === 'img') addDomEl(item); else drawItem(item, 0);
  });
  socket.on('stroke:append', ({ p, id, pts }) => {
    const it = findItem(id, p);
    if (!it || !it.pts) return;
    const old = it.pts.length;
    it.pts.push(...pts);
    if (p === cur) drawItem(it, old);
  });
  socket.on('item:update', ({ p, id, patch }) => {
    const it = findItem(id, p);
    if (!it) return;
    Object.assign(it, patch);
    if (p !== cur) return;
    const el = domEls[id];
    if (!el) return;
    if (Object.keys(patch).every((key) => ['x', 'y', 'w', 'h', 'size'].includes(key))) {
      // chỉ dời / đổi cỡ: sửa tại chỗ, trượt mượt thay vì vẽ lại cả ảnh
      el.classList.add('rm');
      clearTimeout(el._rmT);
      el._rmT = setTimeout(() => el.classList.remove('rm'), 200);
      posEl(el, it);
      if (it.t === 'text') el.style.fontSize = it.size + 'px';
    } else { dom.removeChild(el); delete domEls[id]; addDomEl(it); }
    placeSelBar();
  });
  socket.on('item:remove', ({ p, id }) => removeLocal(p, id));
  socket.on('page:clear', ({ p }) => { items[p] = []; if (p === cur) { redraw(); renderDom(); } myStack = myStack.filter((s) => s.p !== p); });
  socket.on('pages:meta', (m) => {
    pages = m.pages;
    const ids = new Set(pages.map((p) => p.id));
    pages.forEach((p) => { if (!items[p.id]) items[p.id] = []; });
    Object.keys(items).forEach((i) => { if (!ids.has(i)) delete items[i]; });
    if (cur !== m.current) { vx = 0; vy = 0; zoomRel = 1; clampView(); }
    cur = m.current;
    select(null);
    renderTabs(); applyBg(); redraw(); renderDom();
  });
  socket.on('allowDraw', (v) => {
    allowDraw = v;
    document.body.classList.toggle('can-draw', v);
    $('#allowChk').checked = v;
    if (!isT()) { if (!v) setTool('laser'); else setTool('pen'); setTimeout(fit, 0); }
  });
  socket.on('laser', ({ x, y, on }) => {
    const l = $('#laser');
    if (!on) { l.style.display = 'none'; return; }
    l.style.display = 'block';
    l.style.left = (x - vx) * scale + 'px'; l.style.top = (y - vy) * scale + 'px';
    clearTimeout(l._t); l._t = setTimeout(() => { l.style.display = 'none'; }, 2500);
  });
  socket.on('users', (u) => { users = u; renderUsers(); });
  socket.on('hands', (h) => { hands = h; renderUsers(); });
  socket.on('view', takeView);
  socket.on('score', (s) => setScore(s, true));
  socket.on('zap', ({ name }) => { zapEffect(); toast('⚡ ' + name + ' chích điện bạn! Làm lại đi 😆'); });
}

/* ---------- khởi động ---------- */
function openJoin() {
  $('#nameIn').value = localStorage.getItem('bw_name') || '';
  $('#codeIn').value = '';
  $('#nameModal').hidden = false;
  ($('#nameIn').value ? $('#codeIn') : $('#nameIn')).focus();
}
function go() {
  const n = $('#nameIn').value.trim();
  const c = $('#codeIn').value.trim().toUpperCase();
  localStorage.setItem('bw_name', n || 'Khách');
  if (c) localStorage.setItem('bw_key_' + code, c);
  $('#nameModal').hidden = true;
  if (socket) { location.reload(); return; }
  key = c;
  myName = localStorage.getItem('bw_name');
  connect();
}
$('#joinBtn').onclick = go;
$('#nameIn').addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
$('#codeIn').addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
$('#codeBtn').onclick = openJoin;
$('#logoutBtn').onclick = () => {
  if (!confirm('Thôi làm giáo viên trên máy này?')) return;
  localStorage.removeItem('bw_key_' + code);
  location.reload();
};
$('#nameModal').addEventListener('click', (e) => { if (e.target.id === 'nameModal' && socket) $('#nameModal').hidden = true; });

myName = localStorage.getItem('bw_name') || '';
try {
  if (!localStorage.getItem('bw_hint2')) {
    localStorage.setItem('bw_hint2', '1');
    setTimeout(() => toast('Mẹo: dùng 2 ngón tay để kéo bảng lên/xuống và phóng to'), 1500);
  }
} catch (e) { /* bỏ qua */ }
if (key || myName) { myName = myName || 'Khách'; connect(); }
else openJoin();
fit();
})();
</script>
